[versions]
kotlin = "2.2.21"
agp = "8.13.1"
material_icons = "1.7.8"

[plugins]
# Jetbrains Compose Compiler
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
maven-publish = { id = "maven-publish", version = "0.0.0" }

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version = "2025.12.00" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version = "1.12.1" }
androidx-material3 = { module = "androidx.compose.material3:material3", version = "1.4.0" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
#///
androidx-animation =  { group = "androidx.compose.animation", name = "animation" }
androidx-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-ui-util = { group = "androidx.compose.ui", name = "ui-util" }
androidx-material-ripple  = { group = "androidx.compose.material", name = "material-ripple" }

androidx-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core", version.ref = "material_icons" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "material_icons"}

androidx-preferences = { group = "androidx.datastore", name = "datastore-preferences", version = "1.2.0" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version = "3.3.0" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.17.0" }

chrisbanes-haze = {module= "dev.chrisbanes.haze:haze", version = "1.7.0" }
androidx-window = { group = "androidx.window", name = "window", version = "1.5.1" }